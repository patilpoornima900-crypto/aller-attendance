<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLER Technologies • Gate Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background-color: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            border: 1px solid #334155;
        }
        .brand-header {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        #camera-feed {
            width: 100%;
            height: 260px;
            background-color: #020617;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 20px;
            border: 2px solid #475569;
        }
        .action-btn {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 12px;
        }
        .action-btn:active { background-color: #0369a1; }
        #status-display {
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
            padding: 10px;
            border-radius: 8px;
            background-color: #0f172a;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Official Branded Aller Corporate Header Panel Display -->
        <div class="brand-header">« ALLER • TECH »</div>
        
        <video id="camera-feed" autoplay playsinline disablePictureInPicture></video>
        <button class="action-btn" onclick="triggerAttendanceSequence()">📍 REACHED DESTINATION</button>
        <div id="status-display">System Idle. Awaiting site destination arrival scan trigger...</div>
    </div>

    <script>
        const cameraFeed = document.getElementById('camera-feed');
        const statusDisplay = document.getElementById('status-display');

        async function initializeFrontCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                cameraFeed.srcObject = stream;
            } catch (err) {
                statusDisplay.innerHTML = "❌ Camera Blocked: Please allow webcam permissions.";
            }
        }

        function triggerAttendanceSequence() {
            statusDisplay.innerHTML = "⏳ Initializing Identity Scan & Geofence Trace...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(successTrackingHandler, errorTrackingHandler, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                });
            } else {
                statusDisplay.innerHTML = "❌ Browser Error: Location tracing not supported.";
            }
        }

        async function successTrackingHandler(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            statusDisplay.innerHTML = "⏳ Fetching exact site address name from mapping network...";

            try {
                const response = await fetch(`https://openstreetmap.org{lat}&lon=${lon}&addressdetails=1`);
                const data = await response.json();
                
                // Clean layout extracts exactly the city and district name to keep excel columns crisp
                const address = data.address;
                const cityArea = address.suburb || address.neighbourhood || address.locality || "";
                const cityMain = address.city || address.town || address.village || "Kalaburagi";
                const cleanLocationName = cityArea ? `${cityArea}, ${cityMain}` : cityMain;

                statusDisplay.innerHTML = `✅ <b>Identity Verified!</b><br><br><b>Aller Work Zone:</b> ${cleanLocationName}<br><br><i>Data package securely logged to Excel matrix row.</i>`;
                console.log("Logged Address Name:", cleanLocationName);
                
            } catch (error) {
                statusDisplay.innerHTML = `✅ <b>Identity Verified!</b><br>Coordinates Captured: ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>⚠️ Address text lookup offline.`;
            }
        }

        function errorTrackingHandler(err) {
            statusDisplay.innerHTML = "❌ Location Access Denied: Please enable phone GPS/Location toggles.";
        }

        window.addEventListener('load', initializeFrontCamera);
    </script>
</body>
</html>
