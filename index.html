<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLER Technologies • Gate Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background-color: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            border: 1px solid #334155;
        }
        .brand-header {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .user-selector {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            color: #f8fafc;
            border: 1px solid #475569;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 15px;
            outline: none;
        }
        #camera-feed {
            width: 100%;
            height: 240px;
            background-color: #020617;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid #475569;
            transform: scaleX(-1);
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .action-btn {
            flex: 1;
            color: white;
            border: none;
            padding: 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login { background-color: #10b981; }
        .btn-login:active { background-color: #059669; }
        .btn-logout { background-color: #ef4444; }
        .btn-logout:active { background-color: #dc2626; }
        #status-display {
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
            padding: 12px;
            border-radius: 8px;
            background-color: #0f172a;
            text-align: left;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">« ALLER • TECH »</div>
        
        
        <select id="employee-name-select" class="user-selector">
            <option value="Poornima">Select Name: Poornima</option>
            <option value="Ganesh">Select Name: Ganesh</option>
            <option value="Devika">Select Name: Devika</option>
            <option value="Shivani">Select Name: Shivani</option>
        </select>

        <video id="camera-feed" autoplay playsinline disablePictureInPicture></video>
        
        <div class="btn-group">
            <button class="action-btn btn-login" onclick="triggerAttendance('IN')">📍 REACHED SITE</button>
            <button class="action-btn btn-logout" onclick="triggerAttendance('OUT')">🔒 LEAVE SITE</button>
        </div>
        
        <div id="status-display">System Ready. Choose identity and click Reached Site...</div>
    </div>

    <script>
        const cameraFeed = document.getElementById('camera-feed');
        const statusDisplay = document.getElementById('status-display');
        const employeeSelect = document.getElementById('employee-name-select');
        let activePunchType = "";

        async function initializeFrontCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                cameraFeed.srcObject = stream;
            } catch (err) {
                statusDisplay.innerHTML = "⚠️ Camera preview locked. Tap your punch buttons anyway to track position!";
            }
        }

        function triggerAttendance(type) {
            activePunchType = type;
            statusDisplay.innerHTML = `⏳ Tracking live position for ${employeeSelect.value}...`;
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(successTrackingHandler, errorTrackingHandler, {
                    enableHighAccuracy: true, timeout: 10000, maximumAge: 0
                });
            } else {
                statusDisplay.innerHTML = "❌ Browser Error: GPS position tracking not supported.";
            }
        }

        async function successTrackingHandler(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const selectedStaffName = employeeSelect.value;
            statusDisplay.innerHTML = "⏳ Converting coordinates to city address names...";

            try {
                // FIXED SECURE ROUTE: Added a custom User-Agent tag to unblock OpenStreetMap filters
                const response = await fetch(`https://openstreetmap.org{lat}&lon=${lon}&addressdetails=1`, {
                    headers: {
                        'User-Agent': 'AllerTechAttendanceSystem/2.0 (patlpoornima900@gmail.com)'
                    }
                });
                const data = await response.json();
                
                const address = data.address || {};
                const cityArea = address.suburb || address.neighbourhood || address.locality || "";
                const cityMain = address.city || address.town || address.village || "Kalaburagi";
                const cleanLocationName = cityArea ? `${cityArea}, ${cityMain}` : cityMain;

                statusDisplay.innerHTML = `✅ <b>Identity Verified!</b><br><br><b>Employee:</b> ${selectedStaffName}<br><b>Action:</b> ${activePunchType}<br><b>Aller Location:</b> ${cleanLocationName}`;
                
                // --- BEAM DATA DIRECT TO WEBHOOK PORTAL WINDOW TRACKS ---
                fetch('https://infinityfreeapp.com', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        employee_name: selectedStaffName,
                        punch_type: activePunchType,
                        location_name: cleanLocationName,
                        latitude: lat,
                        longitude: lon
                    })
                });
                
            } catch (error) {
                const backupLocation = "Kalaburagi, Karnataka";
                statusDisplay.innerHTML = `✅ <b>Identity Verified!</b><br><br><b>Employee:</b> ${selectedStaffName}<br><b>Action:</b> ${activePunchType}<br><b>Aller Location:</b> ${backupLocation}`;
                
                fetch('https://webhook.site', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        employee_name: selectedStaffName,
                        punch_type: activePunchType,
                        location_name: backupLocation,
                        latitude: lat,
                        longitude: lon
                    })
                });
            }
        }

        function errorTrackingHandler(err) {
            statusDisplay.innerHTML = "❌ GPS Lock Failure: Please turn on your device location toggles.";
        }

        window.addEventListener('load', initializeFrontCamera);
    </script>
</body>
</html>
